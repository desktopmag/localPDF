<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LocalPDF - a privacy-first PDF editor that runs 100% in your browser. Merge, split, rotate, compress, convert, watermark and sign PDFs. No uploads, no servers, no tracking." />
    <meta name="theme-color" content="#0A0A0C" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>LocalPDF · Privacy-first PDF tools, 100% in your browser</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('localpdf-theme') || 'dark';
          document.documentElement.classList.toggle('dark', t !== 'light');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
