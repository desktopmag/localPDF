    <script>
      (function () {
        try {
          var t = localStorage.getItem('bolapdf-theme') || localStorage.getItem('localpdf-theme') || 'dark';
          document.documentElement.classList.toggle('dark', t !== 'light');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
